<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 976" font-family="Pretendard Variable, Pretendard, Arial, sans-serif"><title>위스티아의 장점</title><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fcfaf6"/><stop offset="1" stop-color="#f3efe7"/></linearGradient></defs><g transform="translate(12 8)"><rect width="336" height="312" rx="20" fill="url(#paper)" stroke="#e5ddd0" stroke-width=".8"/><text x="28" y="43" font-size="18" fill="#947a4c" font-weight="500">01</text><path d="M58 37h42" stroke="#c9b791" stroke-width=".8"/><circle cx="288" cy="47" r="23" fill="#f4efe4"/><g transform="translate(272 31)" fill="none" stroke="#8b7652" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="3" width="10" height="17" rx="5"/><path d="M6 14v2a9 9 0 0 0 18 0v-2M15 25v5m-6 0h12"/></g><text x="28" y="88" font-size="18" fill="#766c5d" font-weight="500">녹음 방식</text><text x="28" y="125" font-size="22" fill="#38332d" font-weight="600">구간별 녹음 +</text><text x="28" y="154" font-size="22" fill="#38332d" font-weight="600">1:1 디렉팅</text><path d="M28 181h280" stroke="#e0d7c8" stroke-width=".8"/><text x="28" y="218" font-size="17.5" fill="#655e54" font-weight="400">한 곡을 처음부터 끝까지</text><text x="28" y="243" font-size="17.5" fill="#655e54" font-weight="400">부르지 않고 구간별로 나누어</text><text x="28" y="268" font-size="17.5" fill="#655e54" font-weight="400">디렉팅하며 완성합니다</text></g><g transform="translate(12 332)"><rect width="336" height="312" rx="20" fill="url(#paper)" stroke="#e5ddd0" stroke-width=".8"/><text x="28" y="43" font-size="18" fill="#947a4c" font-weight="500">02</text><path d="M58 37h42" stroke="#c9b791" stroke-width=".8"/><circle cx="288" cy="47" r="23" fill="#f4efe4"/><g transform="translate(272 31)" fill="none" stroke="#8b7652" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h24M4 16h24M4 25h24"/><circle cx="10" cy="7" r="3" fill="#f8f5ef"/><circle cx="21" cy="16" r="3" fill="#f8f5ef"/><circle cx="12" cy="25" r="3" fill="#f8f5ef"/></g><text x="28" y="88" font-size="18" fill="#766c5d" font-weight="500">보컬 보정</text><text x="28" y="125" font-size="22" fill="#38332d" font-weight="600">음정·박자</text><text x="28" y="154" font-size="22" fill="#38332d" font-weight="600">수작업 보정</text><path d="M28 181h280" stroke="#e0d7c8" stroke-width=".8"/><text x="28" y="218" font-size="17.5" fill="#655e54" font-weight="400">자동 보정에만 의존하지 않고</text><text x="28" y="243" font-size="17.5" fill="#655e54" font-weight="400">원래 목소리의 느낌을 살려</text><text x="28" y="268" font-size="17.5" fill="#655e54" font-weight="400">세밀하게 보정합니다</text></g><g transform="translate(12 656)"><rect width="336" height="312" rx="20" fill="url(#paper)" stroke="#e5ddd0" stroke-width=".8"/><text x="28" y="43" font-size="18" fill="#947a4c" font-weight="500">03</text><path d="M58 37h42" stroke="#c9b791" stroke-width=".8"/><circle cx="288" cy="47" r="23" fill="#f4efe4"/><g transform="translate(272 31)" fill="none" stroke="#8b7652" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="27" height="22" rx="4"/><path d="M3 13h27m-8 8h4M7 6V3h18"/></g><text x="28" y="88" font-size="18" fill="#766c5d" font-weight="500">추가 비용</text><text x="28" y="125" font-size="22" fill="#38332d" font-weight="600">상담 시 안내드린</text><text x="28" y="154" font-size="22" fill="#38332d" font-weight="600">금액 그대로</text><path d="M28 181h280" stroke="#e0d7c8" stroke-width=".8"/><text x="28" y="218" font-size="17.5" fill="#655e54" font-weight="400">녹음·촬영 시간이 길어져도</text><text x="28" y="243" font-size="17.5" fill="#655e54" font-weight="400">당일 추가 비용은 없습니다</text></g></svg>
