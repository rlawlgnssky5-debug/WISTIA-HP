<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" font-family="Pretendard, Arial, sans-serif"><title>위스티아의 장점</title><g transform="translate(0 8)"><rect width="360" height="254" rx="12" fill="#faf8f2" stroke="#d8d3c9"/><text x="24" y="40" font-size="18" fill="#302d27" font-weight="600">01</text><text x="66" y="40" font-size="18" fill="#302d27" font-weight="600">녹음 방식</text><g transform="translate(304 21)" fill="none" stroke="#302d27" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="10" height="18" rx="5"/><path d="M5 13v3a9 9 0 0 0 18 0v-3M14 25v5m-6 0h12"/></g><text x="24" y="88" font-size="20" fill="#302d27" font-weight="600">구간별 녹음 +</text><text x="24" y="114" font-size="20" fill="#302d27" font-weight="600">1:1 디렉팅</text><text x="24" y="154" font-size="16" fill="#666057" font-weight="400">한 곡을 처음부터 끝까지</text><text x="24" y="177" font-size="16" fill="#666057" font-weight="400">부르지 않고 구간별로 나누어</text><text x="24" y="200" font-size="16" fill="#666057" font-weight="400">디렉팅하며 완성합니다</text></g><g transform="translate(380 8)"><rect width="360" height="254" rx="12" fill="#faf8f2" stroke="#d8d3c9"/><text x="24" y="40" font-size="18" fill="#302d27" font-weight="600">02</text><text x="66" y="40" font-size="18" fill="#302d27" font-weight="600">보컬 보정</text><g transform="translate(304 21)" fill="none" stroke="#302d27" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h24M4 16h24M4 25h24"/><circle cx="10" cy="7" r="3" fill="#faf8f2"/><circle cx="21" cy="16" r="3" fill="#faf8f2"/><circle cx="12" cy="25" r="3" fill="#faf8f2"/></g><text x="24" y="88" font-size="20" fill="#302d27" font-weight="600">음정·박자</text><text x="24" y="114" font-size="20" fill="#302d27" font-weight="600">수작업 보정</text><text x="24" y="154" font-size="16" fill="#666057" font-weight="400">자동 보정에만 의존하지 않고</text><text x="24" y="177" font-size="16" fill="#666057" font-weight="400">원래 목소리의 느낌을 살려</text><text x="24" y="200" font-size="16" fill="#666057" font-weight="400">세밀하게 보정합니다</text></g><g transform="translate(760 8)"><rect width="360" height="254" rx="12" fill="#faf8f2" stroke="#d8d3c9"/><text x="24" y="40" font-size="18" fill="#302d27" font-weight="600">03</text><text x="66" y="40" font-size="18" fill="#302d27" font-weight="600">추가 비용</text><g transform="translate(304 21)" fill="none" stroke="#302d27" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="28" height="23" rx="4"/><path d="M2 12h28m-8 8h4"/></g><text x="24" y="88" font-size="20" fill="#302d27" font-weight="600">상담 시 안내드린</text><text x="24" y="114" font-size="20" fill="#302d27" font-weight="600">금액 그대로</text><text x="24" y="154" font-size="16" fill="#666057" font-weight="400">녹음·촬영 시간이 길어져도</text><text x="24" y="177" font-size="16" fill="#666057" font-weight="400">당일 추가 비용은 없습니다</text></g></svg>
