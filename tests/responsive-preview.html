<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위스티아 반응형 검증</title>
<style>body{margin:0;background:#e8edf1;font:14px sans-serif}nav{padding:12px;display:flex;gap:10px;flex-wrap:wrap}iframe{display:block;width:390px;height:650px;border:0;margin:0 20px;background:#fff}button,select{font:inherit;padding:8px}</style>
<nav><label>화면 폭 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option><option>3030</option></select></label><button data-path="/">홈</button><button data-path="/detail/solo">SOLO</button><button data-path="/detail/duo">DUET</button><button data-path="/event/solo">SOLO 견적</button><button data-path="/event/duo">DUET 견적</button><button data-path="/detail/duet-film">스토리 필름</button></nav>
<label style="display:block;padding:0 12px 12px">페이지 <select id="page"><option value="/">홈</option><option value="/detail/solo">AR SOLO 상세</option><option value="/detail/duo">AR DUET 상세</option><option value="/detail/solo-film">메이킹 상세</option><option value="/detail/duet-film">스토리 필름 상세</option><option value="/event/solo">AR SOLO 가격</option><option value="/event/duo">AR DUET 가격</option><option value="/event/solo-film">메이킹 가격</option><option value="/event/duet-film">스토리 필름 가격</option><option value="/info/process">진행 안내</option><option value="/before-after">보컬 보정 전후</option><option value="/info/about">위스티아 소개</option><option value="/info/location">오시는 길</option><option value="/info/faq">자주 묻는 질문</option><option value="/events">이벤트</option><option value="/song">이전 음원 선택</option><option value="/film">이전 영상 선택</option><option value="/ar/self">이전 본인 AR</option><option value="/ar/friend">이전 친구 AR</option><option value="/section/homeProcess">홈 진행 안내</option><option value="/section/homeCases">실제 영상</option><option value="/detail/wedding">종료된 식전 상세</option><option value="/detail/proposal">종료된 프로포즈 상세</option></select></label>
<iframe id="previewFrame" src="/" title="반응형 미리보기"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelector('#width').addEventListener('change',event=>{frame.style.width=event.target.value+'px'});document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value});document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{frame.src=button.dataset.path;document.querySelector('#page').value=button.dataset.path}))</script></html>
